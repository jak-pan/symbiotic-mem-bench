[package]
name = "symbiotic-mem-bench"
version = "0.1.0"
edition = "2024"
description = "Benchmark contracts and tooling for memory systems"
readme = "README.md"

[features]
default = []
symbiotic-memory-adapter = [
    "dep:async-trait",
    "dep:futures",
    "dep:hex",
    "dep:reqwest",
    "dep:regex",
    "dep:rusqlite",
    "dep:symbiotic-core",
    "dep:symbiotic-memory",
    "dep:symbiotic-queue",
    "dep:tokio",
]
# Dashboard backend. Feature-gated so the core harness and `cargo test` stay lean.
server = ["dep:axum", "dep:prost", "dep:rusqlite", "dep:tokio", "dep:tower-http"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
# Path dep per the standing "path deps until v1" policy — the baseline bench
# must measure the LOCAL kit (Stage 2.6 access layer), not a GitHub pin.
symbiotic-memory = { path = "../symbiotic-memory", default-features = false, features = ["sqlite", "http", "cli", "zvec"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
hex = { version = "0.4", optional = true }
reqwest = { version = "0.13.4", features = ["json"], optional = true }
regex = { version = "1", optional = true }
rusqlite = { version = "0.37", features = ["bundled", "chrono"], optional = true }
symbiotic-core = { path = "../symbiotic-foundation/crates/symbiotic-core", optional = true }
symbiotic-queue = { path = "../symbiotic-foundation/crates/symbiotic-queue", optional = true }
axum = { version = "0.8", optional = true }
prost = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "membench"
path = "src/bin/membench.rs"
# Requires the adapter feature: a plain `cargo build` SKIPS this bin rather than
# silently emitting a feature-less binary that compiles but fails every native run.
required-features = ["symbiotic-memory-adapter"]

[[bin]]
name = "membench-server"
path = "src/bin/membench-server.rs"
required-features = ["server"]

[[bin]]
name = "trace_pb_bench"
path = "src/bin/trace_pb_bench.rs"
# Uses dashboard_proto (prost), which is gated behind the server feature.
required-features = ["server"]
