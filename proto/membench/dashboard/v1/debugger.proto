syntax = "proto3";

package membench.dashboard.v1;

message HealthResponse {
  bool ok = 1;
  string service = 2;
  string version = 3;
  string git_sha = 4;
  string binary_sha = 5;
}

message QTypeScore {
  double accuracy = 1;
  uint32 n = 2;
  uint32 correct = 3;
  uint32 total = 4;
}

message TrialMarker {
  string stack_id = 1;
  string change_id = 2;
  string change_title = 3;
  string decision = 4;
  string analysis_path = 5;
  optional string compared_to_run_id = 6;
  optional string original_baseline_run_id = 7;
  uint32 improvements = 8;
  uint32 regressions = 9;
  uint32 unchanged_wrong = 10;
  uint32 unchanged_correct = 11;
  uint32 question_count = 12;
  string sample_classification = 13;
  bool focused = 14;
  optional double aggregate_accuracy = 15;
  optional uint32 aggregate_correct = 16;
  optional uint32 aggregate_total = 17;
}

message RunSummary {
  string run_id = 1;
  string origin = 2;
  string system = 3;
  string benchmark = 4;
  optional uint32 limit = 5;
  string run_name = 6;
  string display_name = 7;
  string run_kind = 8;
  string registry_section = 9;
  bool is_meta_record = 10;
  optional string tuning_cohort = 11;
  optional string tuning_shape = 12;
  string config_label = 13;
  string settings_label = 14;
  optional double accuracy = 15;
  optional uint32 accuracy_correct = 16;
  optional uint32 accuracy_total = 17;
  optional double task_averaged_accuracy = 18;
  optional double abstention_accuracy = 19;
  optional int64 cost_micro_usd = 20;
  optional double latency_ms_p50 = 21;
  optional double latency_ms_p95 = 22;
  optional string config_signature = 23;
  string cohort_id = 24;
  optional string dataset_fingerprint = 25;
  optional string judge_model = 26;
  optional string judge_prompt_mode = 27;
  bool oracle_gold = 28;
  optional string created_at = 29;
  optional double modified_ms = 30;
  map<string, QTypeScore> per_question_type = 31;
  repeated string artifacts_available = 32;
  repeated string artifacts_missing = 33;
  optional bool native_state_available = 34;
  bool is_trial_run = 35;
  repeated TrialMarker trial_markers = 36;
}

message RunsResponse {
  repeated RunSummary runs = 1;
}

message PendingRun {
  optional double age_secs = 1;
  string benchmark = 2;
  string config_label = 3;
  uint32 hypotheses = 4;
  uint32 ingested = 5;
  optional uint32 limit = 6;
  bool oracle_gold = 7;
  string origin = 8;
  string run_id = 9;
  string run_name = 10;
  string settings_label = 11;
  optional double started_ms = 12;
  string status = 13;
  string system = 14;
  optional double updated_ms = 15;
}

message PendingResponse {
  repeated PendingRun pending = 1;
}

message QuestionRow {
  string question_id = 1;
  optional string question_type = 2;
  optional string question = 3;
  optional string gold_answer = 4;
  optional string hypothesis = 5;
  optional bool label = 6;
  optional bool is_abstention = 7;
  optional string judge_raw = 8;
  optional string judge_system_prompt = 9;
  optional string judge_user_prompt = 10;
  optional string judge_model = 11;
  optional string router_pick = 12;
  optional string initial_pick = 13;
  optional string final_pick = 14;
  optional string debug_artifact = 15;
  optional string error = 16;
}

message QuestionsResponse {
  uint32 total = 1;
  repeated QuestionRow questions = 2;
}

message RankedRow {
  RunSummary summary = 1;
  uint32 rank = 2;
}

message Cohort {
  string cohort_id = 1;
  string benchmark = 2;
  optional uint32 limit = 3;
  uint32 run_count = 4;
  repeated string dataset_fingerprints = 5;
  repeated string judge_models = 6;
  bool strictly_comparable = 7;
  optional double best_accuracy = 8;
  repeated RankedRow rows = 9;
  repeated string judge_prompt_modes = 10;
}

message LeaderboardResponse {
  repeated Cohort cohorts = 1;
}

message ModelStat {
  string model = 1;
  string operator = 2;
  string operation = 3;
  uint32 calls = 4;
  uint32 input_tokens = 5;
  uint32 output_tokens = 6;
  optional int64 cost_micro_usd = 7;
  bool cost_estimated = 8;
  optional string pricing_source = 9;
  optional double latency_ms_p50 = 10;
  uint32 failed_calls = 11;
  uint32 cached_input_tokens = 12;
  uint32 uncached_input_tokens = 13;
  uint32 response_cache_hits = 14;
  uint32 prompt_cache_hits = 15;
  uint32 prompt_cache_partial_hits = 16;
  uint32 prompt_cache_misses = 17;
}

message ModelRollup {
  uint32 calls = 1;
  uint32 failed_calls = 2;
  uint32 input_tokens = 3;
  uint32 output_tokens = 4;
  optional int64 cost_micro_usd = 5;
  bool cost_estimated = 6;
  optional string pricing_table_version = 7;
  repeated string pricing_sources = 8;
  optional double latency_ms_p50 = 9;
  optional double latency_ms_p95 = 10;
  repeated ModelStat models = 11;
  map<string, string> roles = 12;
  uint32 cached_input_tokens = 13;
  uint32 uncached_input_tokens = 14;
  uint32 response_cache_hits = 15;
  uint32 prompt_cache_hits = 16;
  uint32 prompt_cache_partial_hits = 17;
  uint32 prompt_cache_misses = 18;
  string roles_detail_json = 19;
}

message CohortFields {
  optional string dataset_fingerprint = 1;
  optional string judge_model = 2;
  optional string judge_prompt_mode = 3;
  map<string, string> models = 4;
  repeated ModelStat role_stats = 5;
  string config_signature = 6;
  optional int64 cost_micro_usd = 7;
  optional double latency_ms_p50 = 8;
  optional double latency_ms_p95 = 9;
  optional uint32 cached_input_tokens = 10;
  optional uint32 uncached_input_tokens = 11;
  optional uint32 response_cache_hits = 12;
  optional uint32 prompt_cache_hits = 13;
  optional uint32 prompt_cache_partial_hits = 14;
  optional uint32 prompt_cache_misses = 15;
  optional uint32 output_tokens = 16;
}

message RunDetailResponse {
  RunSummary summary = 1;
  string report_json = 2;
  string params_json = 3;
  CohortFields cohort = 4;
  optional ModelRollup cost = 5;
}

message CompareCounts {
  uint32 common = 1;
  uint32 newly_correct = 2;
  uint32 newly_wrong = 3;
  uint32 unchanged_correct = 4;
  uint32 unchanged_wrong = 5;
  uint32 abstention_changes = 6;
  uint32 only_in_base = 7;
  uint32 only_in_candidate = 8;
}

message TypeDelta {
  string question_type = 1;
  uint32 n = 2;
  double base_accuracy = 3;
  double candidate_accuracy = 4;
  double delta = 5;
}

message ChangedRow {
  string question_id = 1;
  optional string question_type = 2;
  optional string question = 3;
  optional string gold_answer = 4;
  optional string base_hypothesis = 5;
  optional bool base_label = 6;
  optional string candidate_hypothesis = 7;
  optional bool candidate_label = 8;
  string transition = 9;
}

message CompareResult {
  optional double base_accuracy = 1;
  optional double candidate_accuracy = 2;
  optional double accuracy_delta = 3;
  CompareCounts counts = 4;
  repeated TypeDelta per_type = 5;
  repeated ChangedRow changed = 6;
}

message CompareResponse {
  RunSummary base = 1;
  RunSummary candidate = 2;
  CompareResult result = 3;
}

message QueuePressure {
  uint32 queued = 1;
  uint32 running = 2;
  uint32 succeeded = 3;
  uint32 failed = 4;
  uint32 dead = 5;
  uint32 in_flight = 6;
  uint32 window = 7;
}

message QueueBreakdown {
  string queue_id = 1;
  string operation = 2;
  uint32 queued = 3;
  uint32 running = 4;
  uint32 succeeded = 5;
  uint32 failed = 6;
  uint32 dead = 7;
  uint32 in_flight = 8;
  uint32 window = 9;
  uint32 queued_units = 10;
  uint32 running_units = 11;
  uint32 succeeded_units = 12;
  uint32 failed_units = 13;
  uint32 dead_units = 14;
  uint32 in_flight_units = 15;
  uint32 observed_peak_running = 16;
  uint32 observed_peak_running_units = 17;
  uint32 starts_last_minute = 18;
  uint32 starts_last_minute_units = 19;
  uint32 peak_starts_per_minute = 20;
  uint32 peak_starts_per_minute_units = 21;
  double avg_running = 22;
  double avg_running_units = 23;
  double avg_queued = 24;
  double avg_queued_units = 25;
  double avg_starts_per_minute = 26;
  double avg_starts_per_minute_units = 27;
  double observed_duration_secs = 28;
  optional string last_event_at = 29;
}

message ModelLive {
  uint32 window_calls = 1;
  uint32 window_failed = 2;
  uint32 input_tokens = 3;
  uint32 output_tokens = 4;
  uint32 total_bytes = 5;
}

message LiveErrorRow {
  optional string timestamp = 1;
  string source = 2;
  optional string kind = 3;
  string message = 4;
}

message ErrorCategory {
  string category = 1;
  string source = 2;
  optional string kind = 3;
  uint32 count = 4;
}

message StageSegment {
  string id = 1;
  uint32 started = 2;
  uint32 succeeded = 3;
  uint32 failed = 4;
  uint32 in_flight = 5;
  uint32 item_succeeded = 6;
  uint32 item_failed = 7;
  double progress = 8;
  string status = 9;
}

message StageProgress {
  string operation = 1;
  uint32 started = 2;
  uint32 succeeded = 3;
  uint32 failed = 4;
  uint32 item_succeeded = 5;
  uint32 item_failed = 6;
  string item_unit = 7;
  uint32 in_flight = 8;
  uint32 intermediate_failed = 9;
  repeated StageSegment segments = 10;
  optional string last_event = 11;
  optional string last_event_at = 12;
}

message LiveActivityRow {
  optional string timestamp = 1;
  string source = 2;
  string operation = 3;
  string status = 4;
  optional string queue_id = 5;
  string message = 6;
  string severity = 7;
}

message LiveDetail {
  QueuePressure queue = 1;
  repeated QueueBreakdown queues = 2;
  ModelLive model = 3;
  repeated StageProgress memory_stages = 4;
  uint32 memory_failures = 5;
  repeated ErrorCategory error_categories = 6;
  repeated LiveErrorRow errors = 7;
  repeated LiveActivityRow activity = 8;
}

message LiveResponse {
  PendingRun pending = 1;
  LiveDetail detail = 2;
}

message NumericMetricSummary {
  uint32 count = 1;
  optional double p50 = 2;
  optional double p80 = 3;
  optional double p95 = 4;
  optional double p98 = 5;
  optional double max = 6;
}

message MemoryStageTimingRow {
  string operation = 1;
  uint32 events = 2;
  uint32 batch_events = 3;
  uint32 intermediate_failed = 4;
  uint32 failed = 5;
  uint32 item_count = 6;
  string item_unit = 7;
  optional double work_ms_p50 = 8;
  optional double work_ms_p80 = 9;
  optional double work_ms_p95 = 10;
  optional double work_ms_p98 = 11;
  map<string, NumericMetricSummary> numeric_metrics = 12;
}

message MemoryTraces {
  uint32 total = 1;
  bool truncated = 2;
}

message QueueTiming {
  string queue_id = 1;
  string item_id = 2;
  string operation = 3;
  uint32 attempts = 4;
  optional double wait_ms = 5;
  optional double run_ms = 6;
  optional double total_ms = 7;
  optional string final_status = 8;
}

message TraceWaterfallBlock {
  string kind = 1;
  double start_ms = 2;
  double end_ms = 3;
  double duration_ms = 4;
  string label = 5;
  string status = 6;
  string source = 7;
  uint32 item_count = 8;
  string item_unit = 9;
}

message TraceWaterfallLane {
  string name = 1;
  string kind = 2;
  repeated TraceWaterfallBlock blocks = 3;
}

message TraceWaterfall {
  optional string timeline_start = 1;
  optional string timeline_end = 2;
  double duration_ms = 3;
  uint32 block_count = 4;
  bool truncated = 5;
  repeated TraceWaterfallLane lanes = 6;
}

message DependencyWaterfallBlock {
  string kind = 1;
  string label = 2;
  double start_ms = 3;
  double end_ms = 4;
  double duration_ms = 5;
  uint32 item_count = 6;
  string item_unit = 7;
}

message DependencyWaterfallLane {
  string source = 1;
  double wait_ms = 2;
  optional double setup_ms = 3;
  repeated DependencyWaterfallBlock blocks = 4;
}

message DependencyWaterfall {
  optional string timeline_start = 1;
  optional string timeline_end = 2;
  double duration_ms = 3;
  repeated DependencyWaterfallLane lanes = 4;
}

message TraceEventRow {
  string timestamp = 1;
  string kind = 2;
  string operation = 3;
  string lane = 4;
  string event = 5;
  string status = 6;
  uint32 attempt = 7;
  optional double duration_ms = 8;
  optional double wait_ms = 9;
  optional double run_ms = 10;
  optional double total_ms = 11;
  uint32 item_count = 12;
  string item_unit = 13;
  string source = 14;
  optional string error = 15;
}

message TraceEventStream {
  uint32 total = 1;
  bool truncated = 2;
  repeated TraceEventRow rows = 3;
}

message WorkflowQueueEventRow {
  string item_id = 1;
  string queue_id = 2;
  string kind = 3;
  string status = 4;
  uint32 attempt = 5;
  optional string timestamp = 6;
  optional string error = 7;
}

message WorkflowQueueDatabase {
  string path = 1;
  uint32 total_items = 2;
  uint32 total_events = 3;
  map<string, uint32> items_by_status = 4;
  map<string, uint32> events_by_status = 5;
  map<string, uint32> queues = 6;
  uint32 retried_items = 7;
  uint32 max_attempt = 8;
  repeated WorkflowQueueEventRow recent_errors = 9;
  repeated WorkflowQueueEventRow recent_events = 10;
}

message WorkflowQueueSummary {
  repeated WorkflowQueueDatabase databases = 1;
}

message TracesResponse {
  MemoryTraces memory_traces = 1;
  repeated MemoryStageTimingRow memory_stage_timing = 2;
  optional ModelRollup model_rollup = 3;
  repeated QueueTiming queue_timing = 4;
  optional TraceWaterfall trace_waterfall = 5;
  optional DependencyWaterfall dependency_waterfall = 6;
  optional TraceEventStream trace_events = 7;
  optional WorkflowQueueSummary workflow_queue = 8;
}

message GoldRankDistribution {
  uint32 n = 1;
  uint32 within_10 = 2;
  uint32 within_20 = 3;
  uint32 within_50 = 4;
  uint32 within_100 = 5;
  double mean = 6;
}

message GoldRankSummary {
  GoldRankDistribution embed = 1;
  GoldRankDistribution rerank = 2;
  uint32 gold_turns_in_set = 3;
  uint32 gold_turns_total = 4;
  double gold_turn_in_set_pct = 5;
}

message GoldCoverageBySource {
  uint32 fact = 1;
  uint32 raw = 2;
  uint32 both = 3;
  uint32 none = 4;
}

message GoldEvalSummary {
  uint32 total = 1;
  uint32 correct = 2;
  uint32 wrong = 3;
  uint32 abstained = 4;
  uint32 single_piece = 5;
  uint32 multi_piece = 6;
  uint32 gold_pieces_needed = 7;
  uint32 gold_pieces_covered = 8;
  double piece_coverage = 9;
  map<string, uint32> class_counts = 10;
  GoldCoverageBySource coverage_by_source = 11;
  optional GoldRankSummary gold_rank = 12;
}

message GoldEvalQuestion {
  string qid = 1;
  optional string type = 2;
  string answer_json = 3;
  uint32 n_gold_pieces = 4;
  uint32 covered_pieces = 5;
  repeated string missing_pieces = 6;
  uint32 covered_by_fact = 7;
  uint32 covered_by_raw = 8;
  optional uint32 gold_top_rank = 9;
  optional uint32 gold_deepest_rank = 10;
  optional uint32 gold_embed_rank = 11;
  optional uint32 gold_rerank_rank = 12;
  uint32 gold_turns_in_set = 13;
  uint32 gold_turns_total = 14;
  bool correct = 15;
  bool abstained = 16;
  string classification = 17;
}

message GoldEvalResponse {
  uint32 schema_version = 1;
  string run_name = 2;
  string dataset_path = 3;
  GoldEvalSummary summary = 4;
  repeated GoldEvalQuestion questions = 5;
}

message QuestionDebugResponse {
  string path = 1;
  string json = 2;
}

message ArtifactResponse {
  string kind = 1;
  string json = 2;
  repeated string rows_json = 3;
  uint32 total = 4;
  uint32 offset = 5;
  uint32 limit = 6;
}

message ParamField {
  string name = 1;
  string label = 2;
  string kind = 3;
  string default_json = 4;
  repeated string options = 5;
  repeated string observed = 6;
  string group = 7;
  string help = 8;
  bool required = 9;
}

message RunnerSchema {
  string system = 1;
  string benchmark = 2;
  repeated ParamField fields = 3;
}

message PlannedCommand {
  string program = 1;
  repeated string args = 2;
}

message RunnerPreview {
  string run_root = 1;
  PlannedCommand run_command = 2;
  string run_shell = 3;
  optional PlannedCommand score_command = 4;
  optional string score_shell = 5;
  repeated EnvDefault env_defaults = 6;
  repeated string warnings = 7;
}

message EnvDefault {
  string key = 1;
  string value = 2;
}
