recall:
  version: memory-recall-v3-raw-wide-diagnostic
  fact_top_k: 20
  raw_turn_top_k: 80
  raw_fallback_top_k: 80
  query_planner: scripted
  always_include_raw_turns: true
  raw_recall_primary: true
  raw_recall_include_facts: false
  temporal_grounding: Gated
  count_hint: true
  preference_grounding: true
  detail_gap_escalation: true
  enable_temporal_policy: true
  enable_preference_policy: true
  enable_count_policy: true
  enable_current_state_policy: true
  enable_unavailable_policy: true
  enable_artifact_policy: true
  answerer_enabled: true
  support_retry_limit: 1

queue:
  workflow_max_in_flight: 50
  defaults:
    max_in_flight: 8
    timeout_seconds: 600
    retry_attempts: 4
    logical_retry_attempts: 4
  operations:
    chat:
      max_in_flight: 20
      timeout_seconds: 600
      retry_attempts: 4
      logical_retry_attempts: 4
    embedding:
      max_in_flight: 400
      timeout_seconds: 300
      retry_attempts: 6
      logical_retry_attempts: 6
  models:
    "chat:deepseek:deepseek-v4-flash":
      max_in_flight: 400
      timeout_seconds: 420
      retry_attempts: 4
      logical_retry_attempts: 4
    "chat:deepseek:deepseek-v4-pro":
      max_in_flight: 400
      timeout_seconds: 600
      retry_attempts: 4
      logical_retry_attempts: 4
    "embedding:gemini:gemini-embedding-2":
      max_in_flight: 400
      timeout_seconds: 300
      retry_attempts: 6
      logical_retry_attempts: 6
      requests_per_minute: 2700
      input_units_per_minute: 900000

providers:
  chat_provider: openai-compatible
  chat_model: deepseek-v4-pro
  embedding_provider: hash
  embedding_model: hash-embedding-v1
  prompt_cache: true
  distill:
    operation: chat
    operator: deepseek
    model: deepseek-v4-flash
  answer:
    operation: chat
    operator: deepseek
    model: deepseek-v4-pro
  embedding:
    operation: embedding
    operator: gemini
    model: gemini-embedding-2
