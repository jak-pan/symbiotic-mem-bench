recall:
  version: memory-recall-v3-raw-only
  fact_top_k: 0
  raw_turn_top_k: 40
  query_planner: flash
  include_facts: false
  preference_grounding: true
  answerer_enabled: true

queue:
  workflow_max_in_flight: 10
  defaults:
    timeout_seconds: 600
    retry_attempts: 4
    logical_retry_attempts: 4
