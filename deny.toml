# Dependency policy for the public Membench release graph. Audited in CI
# (`cargo deny check`). The credentialed adapter has a separate, non-workspace
# manifest and is not part of the public product package.

[graph]
all-features = false
features = ["server"]

[advisories]
# RustSec advisory database, default settings.

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]

[sources]
# The public root manifest must not contain Git dependencies.
unknown-git = "deny"
